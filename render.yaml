# Render Blueprint — $0 tier (trial / smoke test only)
# For a FULLY WORKING demo use:  ./scripts/share-full-demo.sh  (Mac + Cloudflare)
#
# This file is NOT recommended for production-like demos:
#   - API sleeps when idle; Postgres 1 GB + 30-day expiry; no Redis (1 API worker)
# Paid + Redis: render.paid.yaml

services:
  - type: web
    name: titan-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_API_BASE_URL
        value: https://titan-api.onrender.com
      - key: VITE_TILE_API_BASE_URL
        value: https://titan-api.onrender.com
      - key: VITE_USE_ROAD_TILES
        value: "1"
      - key: VITE_ROAD_TILES_DATASET
        value: iowa_cv_winter_2025
      - key: VITE_ENABLE_WEBSITE_BUILDER_ROUTES
        value: "0"
      - key: VITE_ENABLE_CHART_EDITING
        value: "0"

  - type: web
    name: titan-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render-api
    plan: free
    region: ohio
    healthCheckPath: /healthz
    envVars:
      - key: POSTGIS_DSN
        fromDatabase:
          name: titan-postgis
          property: connectionString
      - key: APP_ENV
        value: development
      - key: REQUIRE_USER_ID
        value: "0"
      - key: CORS_ALLOW_ORIGINS
        value: https://titan-web.onrender.com
      - key: OAUTH_REDIRECT_BASE
        value: https://titan-web.onrender.com
      - key: GOOGLE_API_KEY
        sync: false
      - key: AGENT_MODEL_BACKEND
        value: litellm
      - key: AGENT_MODEL_DEFAULT
        sync: false
      - key: AGENT_LITELLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_SKILLS_ENABLED
        value: "1"
      - key: DEFAULT_CV_DATASET
        value: iowa_cv_winter_2025
      - key: RUN_DB_INIT
        value: "1"

databases:
  - name: titan-postgis
    databaseName: traffic
    user: titan
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
