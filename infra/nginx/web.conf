worker_processes auto;

events {
    worker_connections 2048;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 2048;
    log_format traffic_timing escape=json
        '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","cache":"$upstream_cache_status","host":"$host"}';
    access_log /dev/stdout traffic_timing;
    error_log /dev/stderr warn;

    proxy_cache_path /var/cache/nginx/tiles
        levels=1:2
        keys_zone=tiles_cache:256m
        max_size=4g
        inactive=30m
        use_temp_path=off;

    proxy_cache_path /var/cache/nginx/bbox
        levels=1:2
        keys_zone=bbox_cache:16m
        max_size=128m
        inactive=10m
        use_temp_path=off;

    upstream app_api {
        server app_api:8000;
        keepalive 32;
    }

    upstream tile_api {
        server tile_api:8001;
        keepalive 64;
    }

    map $request_method $cache_bypass_non_get {
        default 1;
        GET 0;
        HEAD 0;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 100m;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location /tiles/roads/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tile_api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering on;
            proxy_buffers 32 64k;
            proxy_busy_buffers_size 256k;

            proxy_cache tiles_cache;
            proxy_cache_key "$scheme://$host$request_uri";
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 206 15m;
            proxy_cache_valid 204 1m;
            proxy_cache_valid 404 1m;
            proxy_no_cache $cache_bypass_non_get;
            proxy_cache_bypass $cache_bypass_non_get;

            add_header X-Proxy-Cache $upstream_cache_status always;
        }

        location = /api/roads/bbox {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tile_api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_cache bbox_cache;
            proxy_cache_key "$scheme://$host$request_uri";
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 5s;
            proxy_no_cache $cache_bypass_non_get;
            proxy_cache_bypass $cache_bypass_non_get;

            add_header X-Proxy-Cache $upstream_cache_status always;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app_api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
